name: Phase1A task journal adapter

on:
  push:
    branches:
      - phase1a/task-journal-adapter
    paths:
      - '.github/workflows/phase1a-task-journal-adapter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1a/task-journal-adapter
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply adapter refactor and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1a-task-journal-adapter.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check

      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/renderer/src/store.ts
          git commit -m 'refactor: centralize runtime task journal mutations'
          git push origin HEAD:phase1a/task-journal-adapter
