name: Phase1B renderer current task bridge

on:
  push:
    branches:
      - phase1b/renderer-current-task-bridge
    paths:
      - '.github/workflows/phase1b-renderer-current-task-bridge.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/renderer-current-task-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json
      - name: Apply renderer current task bridge and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1b-renderer-current-task-bridge.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
      - name: Commit verified renderer bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/renderer/src/store.ts
          git commit -m 'feat: carry current task index through renderer state'
          git push origin HEAD:phase1b/renderer-current-task-bridge
