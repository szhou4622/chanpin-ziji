name: Phase1B task identity boundary

on:
  push:
    branches:
      - phase1b/task-identity-boundary
    paths:
      - '.github/workflows/phase1b-task-identity.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/task-identity-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json
      - name: Apply identity persistence patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1b-task-identity.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
      - name: Commit verified identity boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/taskModel.ts product-operation-report-app/src/shared/taskModel.test.ts
          git commit -m 'feat: persist task logical and payload identity'
          git push origin HEAD:phase1b/task-identity-boundary
