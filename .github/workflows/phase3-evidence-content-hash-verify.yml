name: Phase3 evidence content hash verify

on:
  push:
    branches:
      - phase3/evidence-content-hash
    paths:
      - '.github/workflows/phase3-evidence-content-hash-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase3/evidence-content-hash
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply guarded evidence identity patch
        run: |
          set -euo pipefail
          python .github/scripts/phase3-evidence-content-hash.py
          git diff --check

      - name: Install dependencies
        working-directory: product-operation-report-app
        run: npm ci

      - name: Verify evidence identity migration
        working-directory: product-operation-report-app
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run test:architecture
          npm run test:unit
          npm run build

      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/types.ts \
                  product-operation-report-app/src/shared/reportDisplay.ts \
                  product-operation-report-app/src/shared/reportDisplay.test.ts \
                  product-operation-report-app/src/main/project.ts \
                  product-operation-report-app/src/renderer/src/store.ts \
                  product-operation-report-app/src/renderer/src/sourceCleanBatches.ts \
                  product-operation-report-app/src/renderer/src/sourceCleanBatches.test.ts \
                  product-operation-report-app/src/renderer/src/validate.ts \
                  product-operation-report-app/src/renderer/src/validate.test.ts
          if git diff --cached --quiet; then
            echo 'No generated evidence identity changes to commit.'
            exit 1
          fi
          git commit -m 'feat: anchor evidence ids to uploaded content hashes'
          git push origin HEAD:phase3/evidence-content-hash
