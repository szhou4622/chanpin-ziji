name: Phase0 validator alignment

on:
  push:
    branches:
      - phase0/validator-contract-alignment
    paths:
      - '.github/workflows/phase0-validator-alignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0/validator-contract-alignment
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase0-validator-alignment.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
          git diff -- product-operation-report-app/src/renderer/src/modules.ts product-operation-report-app/src/renderer/src/modules.test.ts

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/renderer/src/modules.ts product-operation-report-app/src/renderer/src/modules.test.ts
          git commit -m 'fix: align sparse module validation with prompt contracts'
          git push origin HEAD:phase0/validator-contract-alignment
