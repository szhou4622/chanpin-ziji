name: Phase1B shadow payload recovery verify

on:
  push:
    branches:
      - phase1b/module-shadow-lifecycle
    paths:
      - '.github/workflows/phase1b-shadow-payload-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/module-shadow-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json
      - name: Apply payload recovery bridge and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1b-shadow-payload-bridge.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
      - name: Commit verified payload bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/taskModel.ts
          git commit -m 'feat: recover payload-backed completed task instances'
          git push origin HEAD:phase1b/module-shadow-lifecycle
