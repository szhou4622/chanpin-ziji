name: Phase2 interrupted task recovery verify

on:
  push:
    branches:
      - phase2/interrupted-task-recovery
    paths:
      - '.github/workflows/phase2-interrupted-task-recovery-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase2/interrupted-task-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply guarded recovery patch
        run: |
          set -euo pipefail
          python .github/scripts/phase2-interrupted-task-recovery.py
          git diff --check

      - name: Install dependencies
        working-directory: product-operation-report-app
        run: npm ci

      - name: Verify recovery semantics
        working-directory: product-operation-report-app
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run test:architecture
          npm run test:unit
          npm run build

      - name: Commit verified recovery changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/taskModel.ts \
                  product-operation-report-app/src/shared/taskModel.test.ts \
                  product-operation-report-app/src/renderer/src/store.ts
          if git diff --cached --quiet; then
            echo 'No generated recovery changes to commit.'
            exit 1
          fi
          git commit -m 'fix: mark interrupted tasks for safe resume'
          git push origin HEAD:phase2/interrupted-task-recovery
