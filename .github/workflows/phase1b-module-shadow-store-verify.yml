name: Phase1B module shadow store verify

on:
  push:
    branches:
      - phase1b/module-shadow-lifecycle
    paths:
      - '.github/workflows/phase1b-module-shadow-store-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/module-shadow-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json
      - name: Apply module shadow store bridge and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1b-module-shadow-store.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
      - name: Commit verified module shadow store bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/renderer/src/store.ts
          git commit -m 'feat: observe model-backed module task lifecycle'
          git push origin HEAD:phase1b/module-shadow-lifecycle
