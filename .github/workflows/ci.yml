name: Daily CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product-operation-report-app

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint TypeScript
        run: npm run lint

      - name: Run architecture guard
        run: npm run test:architecture

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

  windows-regression:
    name: Windows Electron regression
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product-operation-report-app

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core regression suite
        run: npm run test:regression
