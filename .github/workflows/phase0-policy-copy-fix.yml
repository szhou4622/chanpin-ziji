name: Phase0 policy copy fix

on:
  push:
    branches:
      - phase0/architecture-closure
    paths:
      - '.github/workflows/phase0-policy-copy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0/architecture-closure
          fetch-depth: 0
      - name: Apply exact policy-copy fixes
        shell: bash
        run: |
          set -euo pipefail
          file='product-operation-report-app/src/renderer/src/components/ConversationPanel.tsx'
          python - <<'PY'
          from pathlib import Path
          path = Path('product-operation-report-app/src/renderer/src/components/ConversationPanel.tsx')
          text = path.read_text(encoding='utf-8')
          old1 = 'Excel/ODS/CSV/TSV、PDF、DOC/DOCX、PPTX、Markdown/TXT/RTF、JSON/YAML、HTML/XML、ZIP：单个不超过 40MB'
          new1 = 'Excel/ODS/CSV/TSV、PDF、DOC/DOCX、PPTX、Markdown/TXT/RTF、JSON/YAML、HTML/XML：单个不超过 40MB；ZIP：单个不超过 120MB'
          old2 = '归属只能二选一：自有数据 / 竞品数据；平台、信息类型和补充说明都是选填。被忽略或解析失败的文件不会参与分析。'
          new2 = '归属只能二选一：自有数据 / 竞品数据；资料类型必选，平台和补充说明选填。被忽略或解析失败的文件不会参与分析。'
          for old in (old1, old2):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match: {old!r}')
          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix: align upload and source metadata copy with policy'
          git push origin HEAD:phase0/architecture-closure
