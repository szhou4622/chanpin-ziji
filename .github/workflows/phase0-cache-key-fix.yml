name: Phase0 cache key fix

on:
  push:
    branches:
      - phase0/architecture-closure
    paths:
      - '.github/workflows/phase0-cache-key-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0/architecture-closure
          fetch-depth: 0
      - name: Hash full source note in cache identity
        shell: bash
        run: |
          set -euo pipefail
          file='product-operation-report-app/src/main/sourceCleanCache.ts'
          python - <<'PY'
          from pathlib import Path
          path = Path('product-operation-report-app/src/main/sourceCleanCache.ts')
          text = path.read_text(encoding='utf-8')
          old = "clean.name, clean.kind, clean.attribution || '', clean.platform || '', clean.purpose || '', clean.kindV1 || '', clean.note || '',"
          new = "clean.name, clean.kind, clean.attribution || '', clean.platform || '', clean.purpose || '', clean.kindV1 || '', typeof input.note === 'string' ? input.note : '',"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one cache-key note match, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'fix: include full source note in clean cache key'
          git push origin HEAD:phase0/architecture-closure
