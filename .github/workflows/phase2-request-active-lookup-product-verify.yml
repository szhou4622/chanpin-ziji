name: Phase2 active request lookup product verify

on:
  push:
    branches:
      - phase2/request-lifecycle-foundation
    paths:
      - '.github/workflows/phase2-request-active-lookup-product-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase2/request-lifecycle-foundation
          fetch-depth: 0
      - name: Apply active-task lookup
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase2-request-active-lookup.py
          git diff --check
      - name: Run full server proxy regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s server-updates/points-proxy-v1 -p 'test*.py' -v
      - name: Commit only verified server implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-updates/points-proxy-v1/product_report_proxy.py server-updates/points-proxy-v1/test_request_lifecycle.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No server changes to commit.'
            exit 1
          fi
          git commit -m 'feat: add active request lookup for task reconciliation'
          git push origin HEAD:phase2/request-lifecycle-foundation
