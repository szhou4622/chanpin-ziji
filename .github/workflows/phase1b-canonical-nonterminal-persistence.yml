name: Phase1B canonical nonterminal persistence

on:
  push:
    branches:
      - phase1b/canonical-nonterminal-persistence
    paths:
      - '.github/workflows/phase1b-canonical-nonterminal-persistence.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/canonical-nonterminal-persistence
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply persistence bridge and verify
        shell: pwsh
        run: |
          python .github/scripts/phase1b-canonical-nonterminal-persistence.py
          Set-Location product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          npm run test:regression
          Set-Location ..
          git diff --check

      - name: Commit verified persistence changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/taskModel.ts product-operation-report-app/src/shared/taskModel.test.ts product-operation-report-app/scripts/regression-main.ts
          git commit -m 'feat: persist canonical scheduler states across restart'
          git push origin HEAD:phase1b/canonical-nonterminal-persistence
