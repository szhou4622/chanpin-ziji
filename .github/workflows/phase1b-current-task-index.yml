name: Phase1B current task index

on:
  push:
    branches:
      - phase1b/current-task-index
    paths:
      - '.github/workflows/phase1b-current-task-index.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/current-task-index
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json
      - name: Apply current task index persistence and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1b-current-task-index.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
      - name: Commit verified persistence boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/types.ts product-operation-report-app/src/main/project.ts
          git commit -m 'feat: persist explicit current task pointers'
          git push origin HEAD:phase1b/current-task-index
