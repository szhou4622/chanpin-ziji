name: Phase1B module analysis abort group verify

on:
  push:
    branches:
      - phase1b/module-analysis-abort-group
    paths:
      - '.github/workflows/phase1b-module-analysis-abort-group-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1b/module-analysis-abort-group
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json
      - name: Apply grouped module cancellation and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1b-module-analysis-abort-group.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check
      - name: Commit verified grouped cancellation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/renderer/src/store.ts
          git commit -m 'fix: broadcast module analysis cancellation across concurrent requests'
          git push origin HEAD:phase1b/module-analysis-abort-group
