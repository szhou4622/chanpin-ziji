name: Phase1A task bridge regression

on:
  push:
    branches:
      - phase1a/task-persistence-bridge
    paths:
      - '.github/workflows/phase1a-task-bridge-regression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1a/task-persistence-bridge
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply persistence regression and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1a-task-bridge-regression.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:regression
          cd ..
          git diff --check

      - name: Commit verified regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/scripts/regression-main.ts
          git commit -m 'test: verify task record persistence bridge'
          git push origin HEAD:phase1a/task-persistence-bridge
