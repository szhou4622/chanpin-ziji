name: Import v1.1.1 baseline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-v1.1.1-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'szhou4622/chanpin-ziji'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import audited v1.1.1 baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch v1.1.1 https://github.com/szhou4622/product-operation-report-app.git "$tmp/source"

          # Preserve the destination workflow because GITHUB_TOKEN cannot modify workflow files.
          mkdir -p "$tmp/preserve-workflows"
          cp -a .github/workflows/import-v1.1.1-baseline.yml "$tmp/preserve-workflows/"

          # Keep only destination .git, copy the audited source, but exclude source workflows.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github/workflows/***' "$tmp/source/" ./
          mkdir -p .github/workflows
          cp -a "$tmp/preserve-workflows/import-v1.1.1-baseline.yml" .github/workflows/

          git add -A
          if git diff --cached --quiet; then
            echo 'Baseline already imported.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: import product operation report v1.1.1 baseline'
          git push origin HEAD:main
