name: Phase1A task persistence bridge

on:
  push:
    branches:
      - phase1a/task-persistence-bridge
    paths:
      - '.github/workflows/phase1a-task-persistence-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1a/task-persistence-bridge
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-operation-report-app/package-lock.json

      - name: Apply persistence bridge and verify
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase1a-task-persistence-bridge.py
          cd product-operation-report-app
          npm ci
          npm run typecheck
          npm run test:unit
          cd ..
          git diff --check

      - name: Commit verified bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-operation-report-app/src/shared/taskModel.ts product-operation-report-app/src/shared/taskModel.test.ts product-operation-report-app/src/shared/types.ts product-operation-report-app/src/main/project.ts
          git commit -m 'feat: persist canonical task record projection'
          git push origin HEAD:phase1a/task-persistence-bridge
