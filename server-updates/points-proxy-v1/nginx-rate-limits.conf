# Install under /etc/nginx/conf.d/ so these directives load in the http context.
limit_req_zone $binary_remote_addr zone=por_session:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=por_redeem:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=por_chat:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=por_read:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=por_conn:10m;
limit_req_status 429;
limit_conn_status 429;
