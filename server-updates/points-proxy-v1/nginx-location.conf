# Add these exact locations inside the api.dadaozixun.com HTTPS server block.
# The rate-limit zones are declared by nginx-rate-limits.conf at http scope.

location = /api/product-operation-report/v1/health {
    limit_req zone=por_read burst=10 nodelay;
    limit_conn por_conn 10;
    include /etc/nginx/snippets/product-operation-report-proxy.conf;
    proxy_pass http://127.0.0.1:8794/health;
}

location = /api/product-operation-report/v1/session {
    limit_req zone=por_session burst=4 nodelay;
    limit_conn por_conn 6;
    include /etc/nginx/snippets/product-operation-report-proxy.conf;
    proxy_pass http://127.0.0.1:8794/session;
}

location = /api/product-operation-report/v1/wallet {
    limit_req zone=por_read burst=20 nodelay;
    limit_conn por_conn 10;
    include /etc/nginx/snippets/product-operation-report-proxy.conf;
    proxy_pass http://127.0.0.1:8794/wallet;
}

location = /api/product-operation-report/v1/wallet/redeem {
    limit_req zone=por_redeem burst=2 nodelay;
    limit_conn por_conn 4;
    include /etc/nginx/snippets/product-operation-report-proxy.conf;
    proxy_pass http://127.0.0.1:8794/wallet/redeem;
}

location = /api/product-operation-report/v1/chat/completions {
    limit_req zone=por_chat burst=8 nodelay;
    limit_conn por_conn 6;
    include /etc/nginx/snippets/product-operation-report-proxy.conf;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_pass http://127.0.0.1:8794/chat/completions;
}

location ^~ /api/product-operation-report/v1/requests/ {
    limit_req zone=por_read burst=20 nodelay;
    limit_conn por_conn 10;
    include /etc/nginx/snippets/product-operation-report-proxy.conf;
    proxy_pass http://127.0.0.1:8794/requests/;
}

# Unknown business-proxy routes must not be forwarded accidentally.
location ^~ /api/product-operation-report/v1/ {
    return 404;
}
