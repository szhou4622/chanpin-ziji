<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更新内置 API Key</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
      main { padding: 28px 30px; }
      .kicker { color: #2764d9; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 7px 0 8px; font-size: 24px; }
      p { margin: 0 0 18px; color: #667085; font-size: 14px; line-height: 1.65; }
      .service { display: flex; justify-content: space-between; gap: 14px; padding: 12px 14px; margin-bottom: 18px; border: 1px solid #dce4f2; border-radius: 10px; background: white; font-size: 13px; }
      .service span { color: #667085; }
      label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
      input { width: 100%; height: 44px; padding: 0 13px; border: 1px solid #b9c6da; border-radius: 9px; background: white; font: inherit; }
      input:focus { outline: 3px solid rgba(39,100,217,.16); border-color: #2764d9; }
      .note { margin-top: 8px; font-size: 12px; color: #7b8496; }
      #status { min-height: 42px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.55; }
      #status:empty { padding: 0; }
      #status.busy { color: #72520b; background: #fff6d9; }
      #status.ok { color: #17633b; background: #eaf8f0; }
      #status.error { color: #a12b2b; background: #fff0f0; }
      .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
      button { min-width: 92px; height: 38px; padding: 0 16px; border: 1px solid #c8d2e3; border-radius: 8px; background: white; color: #263247; font: inherit; cursor: pointer; }
      button.primary { border-color: #2764d9; background: #2764d9; color: white; font-weight: 700; }
      button:disabled { cursor: wait; opacity: .65; }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">仅在本机处理，不经过聊天</div>
      <h1>更新内置 API Key</h1>
      <p>先测试新 Key，成功后才会替换旧配置。输入内容不会显示、打印或写入 Git。</p>
      <div class="service"><span>当前服务</span><b id="service">正在读取…</b></div>
      <label for="api-key">新的 API Key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="请粘贴完整 Key" autofocus />
      <div class="note">点击保存后通常需要等待几秒进行真实连通测试。</div>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="cancel" type="button">取消</button>
        <button id="save" class="primary" type="button">保存并测试</button>
      </div>
    </main>
    <script src="set-managed-model-key-renderer.js"></script>
  </body>
</html>
